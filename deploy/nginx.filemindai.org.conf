# nginx reverse proxy for filemindai.org -> the app container on 127.0.0.1:4000
#
# Install this BEFORE running certbot:
#   sudo cp deploy/nginx.filemindai.org.conf /etc/nginx/sites-available/filemindai.org
#   sudo ln -s /etc/nginx/sites-available/filemindai.org /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run:  sudo certbot --nginx -d filemindai.org -d www.filemindai.org
# Certbot rewrites this file in place to add the HTTPS server block, an
# HTTP->HTTPS redirect, and the certificate paths — you don't need to add
# those yourself. Re-run "sudo certbot renew --dry-run" any time to confirm
# auto-renewal is wired up correctly.

server {
    listen 80;
    listen [::]:80;
    server_name filemindai.org www.filemindai.org;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OAuth callbacks and chat responses can take a few seconds.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    client_max_body_size 5m;
}
