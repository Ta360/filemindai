# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - gdrive-llm-tanmoy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      # This repo is a monorepo (backend/ + frontend/ + shared/), not a
      # single-package app, so each half needs its own install+build step —
      # the Azure-generated default (checkout, then upload the raw repo with
      # no build at all) produced a package with no dist/ folder, which is
      # why the startup command (cd backend && node dist/backend/src/server.js)
      # had nothing to run and Azure kept serving the previous deployment.
      - name: Install and build backend
        working-directory: backend
        run: |
          npm ci
          npm run build
          npm prune --omit=dev

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Assemble a package matching exactly what the startup command expects:
      # backend/dist (compiled server + shared types) + backend's production
      # node_modules alongside it, and frontend/dist as a sibling folder
      # (server.ts resolves it via "../frontend/dist" relative to backend/).
      - name: Assemble deployment package
        run: |
          mkdir -p deploy/backend
          cp -r backend/dist deploy/backend/dist
          cp -r backend/node_modules deploy/backend/node_modules
          cp backend/package.json deploy/backend/package.json
          mkdir -p deploy/frontend
          cp -r frontend/dist deploy/frontend/dist

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_40A887F1582B4989B4FE2491C8C199B1 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_02FC480024BD443BA4DA10876DDF7C86 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F02F386E14524279AC289A7912AF5EDB }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'gdrive-llm-tanmoy'
          slot-name: 'Production'
          package: .
