# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - gdrive-llm-charts

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # This repo is a monorepo — the chart service lives in charts-service/,
      # not the repo root, so every step here is scoped to that folder. The
      # Azure-generated default ran `pip install -r requirements.txt` at the
      # repo root, where no requirements.txt exists.
      - name: Install dependencies
        working-directory: charts-service
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      # Only the chart service's own files go into the deployment artifact —
      # not the rest of the monorepo (backend/, frontend/, worker/, etc.).
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            charts-service
            !charts-service/antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F1EB49BD7BE84DE4985D70AFABFFB1A7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_450D1B4312914DF0849BC40947C467EE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B0D9AF5ACE184339A1DE476B42D9DEC7 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'gdrive-llm-charts'
          slot-name: 'Production'
          package: .
