# Builds the root Dockerfile (backend + built frontend, see Dockerfile) and
# deploys it as a new Azure Container App, separate from the existing Azure
# Web Apps (main_gdrive-llm-tanmoy.yml, main_gdrive-llm-charts.yml).
#
# One-time setup required before this workflow will succeed — see
# AZURE_CONTAINER_APPS_DEPLOY.md for the exact `az` commands to run.

name: Build and deploy to Azure Container Apps - gdrive-llm-container

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  RESOURCE_GROUP: gdrive-llm-container-rg
  CONTAINER_APP_NAME: gdrive-llm-container
  CONTAINER_APP_ENVIRONMENT: gdrive-llm-container-env
  REGISTRY: gdrivellmacr.azurecr.io
  IMAGE_NAME: gdrive-llm-container

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC login
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CONTAINERAPP_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_CONTAINERAPP_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_CONTAINERAPP_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.REGISTRY }}

      - name: Build and push image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
                        -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy new image to Container App
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
